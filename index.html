<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Proper scaling on phones; no zoom-on-double-tap delays -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6eefa">
  <title>Echo</title>
  <!-- Tab icon: a blue dot, inlined so there's no extra file to load -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%231560d4'/%3E%3C/svg%3E">
  <!-- Inter: closest free match to the deck's bold sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/echo.css">
</head>
<body>
  <!-- Echo app header, copied from the deck: dot + wordmark, tabs, counter -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>Echo</div>
    <nav class="tabs" aria-hidden="true">
      <span class="tab active">For you</span>
      <span class="tab">Following</span>
    </nav>
    <div class="counter" id="counter"></div>
  </header>

  <!-- Every screen (intro, posts, waiting, results) is drawn in here by js/app.js -->
  <main id="main" class="feed"></main>

  <!-- Only visible in test mode (?dev=1) -->
  <button id="reset" class="reset" hidden>Reset (test)</button>

  <!-- type="module" lets the JS files import each other without a build step -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
